[workspace]
resolver = "2"
members = [
    "bindings/frb/log",
    "bindings/frb/photos",
    "crates/assets",
    "crates/core",
    "crates/exif",
    "crates/image",
    "crates/location",
    "crates/ml",
    "crates/photos",
    "crates/vecdb",
    "tools/codegen",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
ente-assets = { path = "crates/assets" }
ente-core = { path = "crates/core" }
ente-exif = { path = "crates/exif" }
ente-frb-log = { path = "bindings/frb/log" }
ente-image = { path = "crates/image" }
ente-location = { path = "crates/location" }
ente-ml = { path = "crates/ml" }
ente-photos = { path = "crates/photos" }
ente-vecdb = { path = "crates/vecdb" }
fast_image_resize = { version = "6.1.0", features = ["image"] }
# Offline fork: `zlib-rs` keeps the inflate / deflate backend that the photos build had before
# removal stage 7. `zip` (through the deleted live-photo crate) used to enable it for the whole
# graph, and png, tiff and heic_decoder (image decode) share this flate2.
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
flutter_rust_bridge = "=2.13.0"
flutter_rust_bridge_codegen = "=2.13.0"
futures-util = "0.3.32"
getrandom = { version = "0.4.0", features = ["wasm_js"] }
hmac = "0.13.0"
image = "0.25.10"
jpeg-encoder = "0.7.1"
log = "0.4.34"
md-5 = "0.11.0"
moxcms = "0.9.1"
ort = { version = "=2.0.0-rc.15", default-features = false }
quick-xml = "0.42.0"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false }
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = "2.0.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.1"
unicode-normalization = "0.1.25"
url = "2.5.9"
zeroize = { version = "1.9.0", features = ["derive"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(frb_expand)'] }
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
collection_is_never_read = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
derive_partial_eq_without_eq = "deny"
empty_drop = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
manual_let_else = "deny"
needless_collect = "deny"
path_buf_push_overwrite = "deny"
rc_mutex = "deny"
read_zero_byte_vec = "deny"
redundant_clone = "deny"
redundant_closure_for_method_calls = "deny"
suspicious_operation_groupings = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unused_async = "deny"
unused_peekable = "deny"
unused_rounding = "deny"
unwrap_used = "deny"

# Unoptimized Argon2 makes production-strength derivations dominate test runtime.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.ente-ml]
opt-level = 3

[profile.dev.package.ente-vecdb]
opt-level = 3

# Offline fork (S25 tuning): upstream had no [profile.release] overrides.
[profile.release]
lto = "thin"
codegen-units = 1
