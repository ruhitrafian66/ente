name: ente_workspace
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

flutter:
  # Temporary Flutter 3.47 rollout guards: preserve CocoaPods and existing
  # app lifecycle wiring. Remove after CI and Xcode support SwiftPM and each
  # app has deliberately migrated to UIScene.
  config:
    enable-swift-package-manager: false
    enable-uiscene-migration: false

workspace:
  - apps/photos
  - apps/photos/plugins/ente_background_manager
  - apps/photos/plugins/ente_crypto
  - apps/photos/plugins/ente_panorama_viewer
  - apps/photos/plugins/ente_photos_platform
  - apps/photos/plugins/ente_vision
  - apps/photos/plugins/ffmpeg
  - apps/photos/plugins/media_extension
  - packages/backup_exclusion
  - packages/ente_components
  - packages/ente_crypto_api
  - packages/ente_icons
  - packages/ente_pure_utils
  - packages/ente_qr
  - packages/local_auth_linux
  - packages/lock_screen
  - packages/native_video_editor
  - packages/screen_cover
  - packages/strings
  - packages/ui

dev_dependencies:
  flutter_lints: 6.0.0

dependency_overrides:
  # 1.2.2 and 1.2.3 write secrets that GNOME Keyring cannot reload (#5589).
  flutter_secure_storage_linux: 1.2.1
  # Fixes an iOS AVFoundation crash for videos whose minFrameDuration is zero.
  # https://github.com/flutter/flutter/issues/151031
  video_player_avfoundation:
    git:
      url: https://github.com/ente/packages.git
      path: packages/video_player/video_player_avfoundation
      ref: e6f7518a2ea4b31cf44e7bd6f44b35b1d66b2085
