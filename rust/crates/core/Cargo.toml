[package]
name = "ente-core"
edition.workspace = true

[dependencies]
argon2.workspace = true
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
blake2b_simd = "1.0.5"
crypto_secretbox = { version = "0.1.0", default-features = false, features = ["alloc", "salsa20"] }
crypto_secretstream = "=0.2.0"
getrandom.workspace = true
hmac.workspace = true
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "chacha", "getrandom", "mlkem", "x25519"] }
md-5.workspace = true
rand_core_06 = { package = "rand_core", version = "0.6.0", features = ["getrandom"] }
salsa20 = "0.10.0"
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize.workspace = true

[lints]
workspace = true
